<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventify Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
  <div class="brand"><span class="brand-icon"><i class="bi bi-grid-3x3-gap-fill"></i></span><span>Eventify</span></div>
  <nav id="sideNav" class="side-nav"></nav>
  <button class="logout-btn" onclick="logout()"><i class="bi bi-box-arrow-left"></i><span>Logout</span></button>
</aside>
<main class="main-area">
  <header class="topbar">
    <div class="top-title" id="topTitle">Dashboard</div>
    <div class="top-right">
      <div class="global-search"><i class="bi bi-search"></i><input id="globalSearch" placeholder="Search events, bookings..." autocomplete="off"></div>
      <button class="icon-btn" onclick="toast('No new notifications')"><i class="bi bi-bell"></i></button>
      <div class="admin-menu" onclick="render('settings')"><span class="admin-avatar"></span><span><b>Alex Rivera</b><small>Admin</small></span><i class="bi bi-chevron-down"></i></div>
    </div>
  </header>
  <section id="content" class="content"></section>
</main>
</div>
<div id="toast" class="eventify-toast"></div>
<div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content wire-modal">
    <div class="modal-header"><h5 id="modalTitle" class="modal-title">Action</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div id="modalBody" class="modal-body"></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
