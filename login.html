<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventify — Log In</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #f8f8f6;

            color: #111;
        }


        /* ================= HEADER ================= */

        .auth-header {

            height: 82px;

            background: #fff;

            border-bottom: 1px solid #e5e5e5;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .auth-logo {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #111;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .auth-logo i {

            font-size: 30px;
        }


        .auth-logo:hover {

            color: #111;
        }


        /* ================= PAGE ================= */

        .auth-page {

            min-height: calc(100vh - 82px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;
        }


        .auth-box {

            width: 100%;

            max-width: 450px;

            background: #fff;

            border: 1px solid #dedede;

            border-radius: 8px;

            padding: 42px;
        }


        .auth-title {

            text-align: center;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .auth-subtitle {

            text-align: center;

            color: #666;

            font-size: 15px;

            margin-bottom: 30px;
        }


        /* ================= ALERT ================= */

        .custom-alert {

            display: none;

            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 5px;

            font-size: 14px;
        }


        .custom-alert.show {

            display: block;
        }


        /* ================= FORM ================= */

        .form-label {

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        .form-control {

            height: 48px;

            border: 1px solid #cfcfcf;

            border-radius: 5px;

            padding: 0 14px;

            font-size: 15px;
        }


        .form-control:focus {

            border-color: #111;

            box-shadow:
                0 0 0 2px rgba(0,0,0,0.08);
        }


        .password-box {

            position: relative;
        }


        .password-box .form-control {

            padding-right: 48px;
        }


        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #555;

            font-size: 18px;

            cursor: pointer;
        }


        .password-toggle:hover {

            color: #111;
        }


        .invalid-feedback {

            font-size: 13px;
        }


        /* ================= OPTIONS ================= */

        .login-options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 15px;
        }


        .remember-label {

            font-size: 13px;

            color: #555;

            cursor: pointer;
        }


        .form-check-input {

            cursor: pointer;
        }


        .forgot-link {

            color: #111;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;

            border: none;

            background: transparent;

            padding: 0;
        }


        .forgot-link:hover {

            text-decoration: underline;
        }


        /* ================= BUTTON ================= */

        .auth-btn {

            width: 100%;

            height: 50px;

            margin-top: 25px;

            border: none;

            border-radius: 5px;

            background: #111;

            color: #fff;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.5px;

            transition: 0.2s;
        }


        .auth-btn:hover {

            background: #333;
        }


        .auth-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;
        }


        /* ================= DIVIDER ================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 28px 0;

            color: #999;

            font-size: 12px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e2e2e2;
        }


        /* ================= SOCIAL ================= */

        .social-buttons {

            display: flex;

            gap: 10px;
        }


        .social-btn {

            flex: 1;

            height: 45px;

            border: 1px solid #d5d5d5;

            background: #fff;

            border-radius: 5px;

            color: #333;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .social-btn:hover {

            background: #f5f5f5;

            border-color: #aaa;
        }


        /* ================= BOTTOM ================= */

        .auth-bottom {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #666;
        }


        .auth-bottom a {

            color: #111;

            font-weight: 700;

            text-decoration: none;
        }


        .auth-bottom a:hover {

            text-decoration: underline;
        }


        /* ================= FOOTER ================= */

        .auth-footer {

            text-align: center;

            margin-top: 30px;

            color: #888;

            font-size: 12px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 576px) {

            .auth-header {

                height: 72px;
            }


            .auth-logo {

                font-size: 25px;
            }


            .auth-logo i {

                font-size: 27px;
            }


            .auth-page {

                padding: 25px 15px;
            }


            .auth-box {

                padding: 28px 22px;
            }


            .auth-title {

                font-size: 26px;
            }


            .social-buttons {

                flex-direction: column;
            }

        }

    </style>
</head>

<body>


<!-- ================= LOGO ONLY ================= -->

<header class="auth-header">

    <a href="index.html" class="auth-logo">

        <i class="bi bi-calendar-event"></i>

        <span>Eventify</span>

    </a>

</header>


<!-- ================= LOGIN ================= -->

<main class="auth-page">

    <div class="auth-box">


        <h1 class="auth-title">
            Welcome Back
        </h1>


        <p class="auth-subtitle">
            Log in to continue to your Eventify account.
        </p>


        <!-- Alert -->

        <div
            id="loginAlert"
            class="custom-alert alert alert-danger"
        >

            <i class="bi bi-exclamation-circle me-1"></i>

            <span id="loginAlertText"></span>

        </div>


        <form id="loginForm" novalidate>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email Address
                </label>


                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>


                <div class="password-box">

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>


                <div class="invalid-feedback">
                    Please enter your password.
                </div>

            </div>


            <!-- OPTIONS -->

            <div class="login-options">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                    >

                    <label
                        class="form-check-label remember-label"
                        for="rememberMe"
                    >
                        Remember me
                    </label>

                </div>


                <button
                    type="button"
                    class="forgot-link"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="auth-btn"
                id="loginBtn"
            >

                LOG IN

                <i class="bi bi-arrow-right ms-1"></i>

            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR CONTINUE WITH
        </div>


        <!-- SOCIAL -->

        <div class="social-buttons">

            <button
                type="button"
                class="social-btn"
                id="googleLogin"
            >

                <i class="bi bi-google me-1"></i>

                Google

            </button>


            <button
                type="button"
                class="social-btn"
                id="facebookLogin"
            >

                <i class="bi bi-facebook me-1"></i>

                Facebook

            </button>

        </div>


        <!-- SIGNUP -->

        <div class="auth-bottom">

            Don't have an account?

            <a href="signup.html">
                Sign up
            </a>

        </div>


        <div class="auth-footer">

            © 2026 Eventify. All rights reserved.

        </div>


    </div>

</main>


<script>


    /* ================= ELEMENTS ================= */

    const loginForm =
        document.getElementById("loginForm");

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const rememberMe =
        document.getElementById("rememberMe");

    const loginBtn =
        document.getElementById("loginBtn");

    const loginAlert =
        document.getElementById("loginAlert");

    const loginAlertText =
        document.getElementById("loginAlertText");


    /* ================= ALERT ================= */

    function showAlert(message, type = "danger") {

        loginAlert.className =
            "custom-alert alert alert-" +
            type +
            " show";

        loginAlertText.textContent =
            message;

    }


    function hideAlert() {

        loginAlert.classList.remove("show");

    }


    /* ================= PASSWORD TOGGLE ================= */

    document
        .getElementById("togglePassword")
        .addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.innerHTML =
                    '<i class="bi bi-eye-slash"></i>';

            } else {

                password.type = "password";

                this.innerHTML =
                    '<i class="bi bi-eye"></i>';

            }

        });


    /* ================= EMAIL ================= */

    email.addEventListener("input", function () {

        this.value =
            this.value
                .replace(/\s/g, "")
                .toLowerCase();

    });


    /* ================= LOGIN ================= */

    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            hideAlert();


            email.value =
                email.value.trim().toLowerCase();


            /* Bootstrap validation */

            if (!loginForm.checkValidity()) {

                event.stopPropagation();

                loginForm.classList.add(
                    "was-validated"
                );

                showAlert(
                    "Please enter your email and password."
                );

                return;

            }


            /* ================= GET USER ================= */

            const storedUser =
                localStorage.getItem(
                    "eventifyUser"
                );


            if (!storedUser) {

                showAlert(
                    "No account found. Please sign up first."
                );

                return;

            }


            let user;


            try {

                user =
                    JSON.parse(storedUser);

            } catch (error) {

                showAlert(
                    "Account data is invalid. Please sign up again."
                );

                return;

            }


            /* ================= CHECK CREDENTIALS ================= */

            if (
                !user.email ||
                !user.password
            ) {

                showAlert(
                    "Account information is incomplete. Please sign up again."
                );

                return;

            }


            if (
                email.value !==
                user.email.toLowerCase()
            ) {

                email.classList.add(
                    "is-invalid"
                );

                showAlert(
                    "Incorrect email address."
                );

                email.focus();

                return;

            }


            email.classList.remove(
                "is-invalid"
            );


            if (
                password.value !==
                user.password
            ) {

                password.classList.add(
                    "is-invalid"
                );

                showAlert(
                    "Incorrect password."
                );

                password.focus();

                return;

            }


            password.classList.remove(
                "is-invalid"
            );


            /* ================= SUCCESS ================= */

            localStorage.setItem(
                "eventifyLoggedIn",
                "true"
            );


            localStorage.setItem(
                "eventifyCurrentUser",
                user.email
            );


            /* Remember Me */

            if (rememberMe.checked) {

                localStorage.setItem(
                    "eventifyRememberMe",
                    "true"
                );

            } else {

                localStorage.removeItem(
                    "eventifyRememberMe"
                );

            }


            /* Button */

            loginBtn.disabled = true;

            loginBtn.innerHTML =
                'LOGGED IN <i class="bi bi-check-circle ms-1"></i>';


            showAlert(
                "Login successful! Redirecting...",
                "success"
            );


            /* Dashboard */

            setTimeout(function () {

                window.location.href =
                    "dashboard.html";

            }, 700);

        }
    );


    /* ================= FORGOT PASSWORD ================= */

    document
        .getElementById("forgotPassword")
        .addEventListener("click", function () {

            const storedUser =
                localStorage.getItem(
                    "eventifyUser"
                );


            if (!storedUser) {

                showAlert(
                    "No account found. Please sign up first."
                );

                return;

            }


            let user;

            try {

                user =
                    JSON.parse(storedUser);

            } catch {

                showAlert(
                    "Unable to recover account information."
                );

                return;

            }


            const enteredEmail =
                prompt(
                    "Enter your registered email address:"
                );


            if (!enteredEmail) {

                return;

            }


            if (
                enteredEmail.trim().toLowerCase() !==
                user.email.toLowerCase()
            ) {

                showAlert(
                    "This email is not registered with Eventify."
                );

                return;

            }


            alert(
                "Password reset demo:\n\n" +
                "Your registered password is: " +
                user.password
            );

        });


    /* ================= SOCIAL ================= */

    document
        .getElementById("googleLogin")
        .addEventListener("click", function () {

            showAlert(
                "Google login will be available when backend authentication is connected.",
                "warning"
            );

        });


    document
        .getElementById("facebookLogin")
        .addEventListener("click", function () {

            showAlert(
                "Facebook login will be available when backend authentication is connected.",
                "warning"
            );

        });


</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
